<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-CV</title>
<style>
body{font-family:system-ui;background:#111827;color:#f9fafb;margin:0;padding:2rem 1rem}
main{max-width:40rem;margin:auto;background:#1f2937;padding:1.5rem;border-radius:1rem}
h1{text-align:center}button,input{font:inherit}button{padding:.7rem 1rem;margin:.3rem;border:0;border-radius:.5rem;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}#capture{background:#38bdf8}#infer{background:#22c55e}
img{display:block;width:100%;margin-top:1rem;border-radius:.6rem}img[hidden]{display:none}
#message{min-height:1.5rem}#message.error{color:#fca5a5}pre{white-space:pre-wrap;line-height:1.6}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.4rem;border-bottom:1px solid #374151}
</style>
</head>
<body><main><h1>ESP32-CV</h1>
<div><button onclick="setLed(true)">Turn LED on</button><button onclick="setLed(false)">Turn LED off</button></div>
<div><button id="capture" onclick="submitJob(false)">Take photo</button>
<button id="infer" onclick="submitJob(true)" disabled>Run inference</button></div>
<p><label>Upload JPEG <input id="upload" type="file" accept="image/jpeg,.jpg,.jpeg" onchange="uploadImage()"></label></p>
<label>Confidence threshold <input id="threshold" type="number" min="0.01" max="1" step="0.01" value="0.25"></label>
<p>Inference uses the most recently captured or uploaded photo. JPEG images are fitted within 320 × 320 while preserving their aspect ratio.</p>
<p id="message" role="status" aria-live="polite">Reading status...</p>
<img id="camera" hidden alt="Most recent captured image">
<pre id="timings"></pre>
<table id="objects" hidden><thead><tr><th>Object</th><th>Score</th><th>Coordinates</th></tr></thead><tbody></tbody></table>
<p id="count"></p>
<details><summary>Device statistics</summary><pre id="stats"></pre></details>
</main><script>
let imageId=-1, submitting=false, lastState=null;
const byId=id=>document.getElementById(id);
function message(text,error=false){byId('message').textContent=text;byId('message').className=error?'error':'';}
function buttons(){const busy=submitting||!lastState||lastState.processing.busy;byId('capture').disabled=busy;byId('infer').disabled=busy||!lastState.processing.has_frame;byId('threshold').disabled=busy;byId('upload').disabled=busy;}
async function checked(url,options){const r=await fetch(url,options);if(!r.ok)throw new Error(await r.text());return r;}
async function setLed(on){try{await checked('/led/'+(on?'on':'off'),{method:'POST'});}catch(e){message(e.message,true);}}
async function submitJob(infer){
 if(submitting||(lastState&&lastState.processing.busy))return;
 const threshold=byId('threshold');if(infer&&!threshold.reportValidity())return;
 submitting=true;buttons();message(infer?'Running inference...':'Capturing photo...');
 try{await checked(infer?'/api/infer?threshold='+encodeURIComponent(threshold.value):'/api/capture',{method:'POST'});if(lastState){lastState.processing.busy=true;lastState.processing.operation=infer?'inference':'capture';}}
 catch(e){message(e.message,true);}
 finally{submitting=false;buttons();}
}
async function uploadImage(){
 const input=byId('upload'),file=input.files[0];
 if(!file||submitting||!lastState||lastState.processing.busy)return;
 submitting=true;buttons();message('Preparing and uploading image...');
 const url=URL.createObjectURL(file);
 try{
  const signature=new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(signature[0]!==0xff||signature[1]!==0xd8)throw new Error('Select a valid JPEG image.');
  const image=new Image();image.src=url;await image.decode();
  const canvas=document.createElement('canvas');
  canvas.width=lastState.image_width;canvas.height=lastState.image_height;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  const scale=Math.min(1,canvas.width/image.naturalWidth,canvas.height/image.naturalHeight);
  const w=Math.max(1,Math.round(image.naturalWidth*scale)),h=Math.max(1,Math.round(image.naturalHeight*scale));
  ctx.drawImage(image,Math.floor((canvas.width-w)/2),Math.floor((canvas.height-h)/2),w,h);
  const rgba=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const pixels=new Uint8Array(canvas.width*canvas.height*2);
  for(let i=0,j=0;i<rgba.length;i+=4,j+=2){
   const rgb=((rgba[i]>>3)<<11)|((rgba[i+1]>>2)<<5)|(rgba[i+2]>>3);
   pixels[j]=rgb>>8;pixels[j+1]=rgb&255;
  }
  await checked('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:pixels});
  if(lastState){lastState.processing.busy=true;lastState.processing.operation='upload';}
 }catch(e){message(e.message,true);}
 finally{URL.revokeObjectURL(url);input.value='';submitting=false;buttons();}
}

function render(s){
 lastState=s;const p=s.processing;buttons();
 if(submitting)return;
 if(p.busy)message(p.operation==='upload'?'Uploading image...':p.operation==='inference'?'Running inference...':'Capturing photo...');
 else if(p.error)message(p.error,true);
 else message(p.has_frame?(p.inferred?'Inference complete.':'Photo ready. You can run inference.'):'Take a photo or upload a JPEG to get started.');
 if(p.image_id!==imageId&&p.has_frame){imageId=p.image_id;byId('camera').src='/image?t='+imageId;byId('camera').hidden=false;}
 byId('timings').textContent=`Capture: ${p.capture_ms.toFixed(1)} ms
Inference: ${p.inference_ms.toFixed(1)} ms
JPEG conversion: ${p.jpeg_ms.toFixed(1)} ms`;
 const tbody=byId('objects').querySelector('tbody');tbody.replaceChildren();
 for(const d of p.objects){const tr=document.createElement('tr');for(const value of [d.name,(d.score*100).toFixed(1)+'%',d.box.join(', ')]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td);}tbody.appendChild(tr);}
 byId('objects').hidden=!p.inferred;
 byId('count').textContent=p.inferred?`${p.total_objects} objects detected`+(p.total_objects>p.objects.length?` (showing the first ${p.objects.length})`:''):'';
 byId('stats').textContent=`Uptime: ${s.uptime_sec} s
Internal temperature: ${s.temperature_c===null?'unavailable':s.temperature_c+' °C'}
CPU0: ${s.cpu0_usage_pct.toFixed(1)}% | CPU1: ${s.cpu1_usage_pct.toFixed(1)}%
Free internal RAM: ${s.internal_ram_free_kb} KB (minimum ${s.internal_ram_min_kb} KB)
Free PSRAM: ${s.psram_free_kb} KB (minimum ${s.psram_min_kb} KB)
Wi-Fi: ${s.wifi_connected ? 'connected' : 'disconnected'}`;
}
byId('camera').onerror=()=>{imageId=-1;message('Could not load the image. Retrying.',true);};
async function poll(){try{render(await(await checked('/api/status',{cache:'no-store'})).json());}catch(e){lastState=null;buttons();message('Device is not responding: '+e.message,true);}finally{setTimeout(poll,1000);}}
poll();
</script></body></html>
